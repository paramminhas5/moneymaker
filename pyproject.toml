[project]
name = "mm"
version = "0.1.0"
description = "MONEYMAKER: gated multi-market automated trading system"
authors = [{ name = "Param Minhas" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "numpy>=2.5.4",
    "scipy>=1.14",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
mm = "mm.control.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "pyright>=1.1.385",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "DTZ"]
ignore = ["S101"]  # asserts are fine in tests and invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src/mm/core", "src/mm/risk", "src/mm/config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs network or external services (deselected in CI by default)",
]
